[project]
name = "special-agent"
version = "0.1.0"
description = "Light-weight agent with customized tool calls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "mlx-code>=0.0.1",
    "pydantic>=2.13.4",
    "sentence-transformers>=5.5.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[project.scripts]
sagent = "special_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/special_agent"]
