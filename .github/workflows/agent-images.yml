name: Agent images

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      refresh_runtime:
        description: Resolve latest stable Pi and catalog extensions
        type: boolean
        default: true
      promote_latest:
        description: Promote latest after all image smoke gates
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'base/**'
      - 'devpod/**'
      - 'headless_agent/Dockerfile'
      - '_template/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/agent-images.yml'

permissions:
  contents: read

concurrency:
  group: agent-images-release
  cancel-in-progress: false

env:
  NPM_CONFIG_USERCONFIG: /dev/null
  NPM_CONFIG_ENGINE_STRICT: 'true'

jobs:
  prepare:
    if: >-
      github.repository == 'rodoyle/my-agent' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      promote: ${{ steps.policy.outputs.promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
      - name: Select release policy
        id: policy
        env:
          REQUEST_REFRESH: ${{ inputs.refresh_runtime || false }}
          REQUEST_PROMOTE: ${{ inputs.promote_latest || false }}
        run: |
          python3 scripts/ci-policy.py --event "$GITHUB_EVENT_NAME" \
            --refresh "$REQUEST_REFRESH" --promote "$REQUEST_PROMOTE" \
            >> "$GITHUB_OUTPUT"
      - name: Resolve a new input snapshot
        env:
          REFRESH: ${{ steps.policy.outputs.refresh }}
        run: |
          resolved="$RUNNER_TEMP/resolved-runtime"
          if [ "$REFRESH" = true ]; then
            timeout 600 python3 scripts/refresh-runtime.py \
              --output-directory "$resolved" > refresh.json
          else
            mkdir "$resolved"
            cp base/runtime/package*.json "$resolved/"
            printf '%s\n' '{"mode":"committed-pins"}' > refresh.json
          fi
          cp "$resolved/"package*.json base/runtime/
      - name: Validate locked inputs and source regressions
        run: |
          timeout 300 npm ci --prefix base/runtime \
            --ignore-scripts --no-audit --no-fund
          timeout 30 node base/runtime/node_modules/@ast-grep/cli/postinstall.js
          timeout 120 python3 -m unittest discover -s tests -v
          timeout 60 node --test tests/profile-config.test.mjs
          node --check base/profile-config.mjs
          node --check tests/image-smoke.mjs
          sh -n base/agent-entrypoint.sh base/ovis.sh
      - name: Snapshot exact publication inputs
        run: |
          mkdir release-inputs
          cp base/runtime/package.json base/runtime/package-lock.json \
            refresh.json release-inputs/
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-inputs/
          if-no-files-found: error
          retention-days: 90

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # No packages-write permission or registry credential in this job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: base/runtime
      - name: Start the credential-free loopback registry
        run: |
          docker run --detach --name agent-image-registry \
            --label agent-image-ci=true \
            --publish 127.0.0.1:5000:5000 registry:2.8.3
          timeout 45 curl --fail --silent --retry 30 \
            --retry-connrefused --retry-delay 1 http://127.0.0.1:5000/v2/
      - name: Build and execute gates without publication credentials
        run: |
          timeout 5100 python3 scripts/ci-release.py \
            --tag "run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --revision "$GITHUB_SHA" \
            --source "https://github.com/$GITHUB_REPOSITORY" \
            --output-directory "$RUNNER_TEMP/tested-images"
      - name: Stop owned containers even after outer timeout
        if: always()
        run: |
          mapfile -t owned < <(docker ps --all --quiet \
            --filter label=agent-image-ci=true)
          if [ "${#owned[@]}" -gt 0 ]; then
            timeout 60 docker rm --force "${owned[@]}"
          fi
      - name: Hand tested bytes to a separate publication job
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tested-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-images/
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Preserve build receipts without the large image archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tested-images/*.json
            ${{ runner.temp }}/tested-images/digests/
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-images
      - name: Authenticate only after image execution has finished
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/agent-images-auth"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested images without executing them
        env:
          PROMOTE: ${{ needs.prepare.outputs.promote }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" |
            tr '[:upper:]' '[:lower:]')
          promote=()
          if [ "$PROMOTE" = true ]; then promote=(--promote-latest); fi
          timeout 1500 python3 scripts/publish-images.py \
            --namespace "ghcr.io/$owner" \
            --tag "run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --revision "$GITHUB_SHA" \
            --input-directory "$RUNNER_TEMP/tested-images" \
            "${promote[@]}"
      - name: Preserve publication receipts and resolved lockfiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-images/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove runner registry credentials
        if: always()
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/agent-images-auth"
          docker logout ghcr.io || true
          rm -rf "$DOCKER_CONFIG"
